name: social-publish

# Manual commands for NEXVATE launch-30. Automatic publishing lives in
# social-loop.yml, which checks every 5 minutes. This workflow has no cron, so
# the two never publish at the same moment. Each run also makes sure the loop
# is up and restarts it if the chain has broken.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish | schedule-facebook | list-facebook | cancel-facebook | dry-run | post | story | replace | list-feed | delete-facebook"
        default: publish
      id:
        description: "post or story id for mode=post/story (e.g. nx-d05, nx-s02-push); comma list for replace"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      PAUSED: ${{ vars.PAUSED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        run: |
          mode="${{ inputs.mode }}"
          case "$mode" in
            publish)           python3 scripts/publish.py ;;
            schedule-facebook) python3 scripts/schedule_facebook.py --apply ;;
            list-facebook)     python3 scripts/schedule_facebook.py --list ;;
            cancel-facebook)   python3 scripts/schedule_facebook.py --cancel-all ;;
            dry-run)           DRY_RUN=1 python3 scripts/publish.py && python3 scripts/schedule_facebook.py ;;
            post)              python3 scripts/publish.py --post "${{ inputs.id }}" ;;
            story)             python3 scripts/publish.py --story "${{ inputs.id }}" ;;
            list-feed)         python3 scripts/schedule_facebook.py --feed ;;
            delete-facebook)   python3 scripts/schedule_facebook.py --delete "${{ inputs.id }}" ;;
            replace)           python3 scripts/replace.py "${{ inputs.id }}" ;;
            *) echo "unknown mode $mode"; exit 1 ;;
          esac
      - name: Save state
        if: always()
        run: |
          git config user.name "nexvate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: published $(date -u +%FT%TZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      - name: Make sure the loop is running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for st in in_progress queued; do
            n=$(( n + $(gh run list -R "${{ github.repository }}" -w social-loop.yml -s $st --json databaseId -q length) ))
          done
          if [ "$n" -eq 0 ]; then gh workflow run social-loop.yml -R "${{ github.repository }}"; echo "loop restarted"; else echo "loop running"; fi
