name: social-publish

# NEXVATE launch-30. Times are UTC (Dubai is UTC+4, no DST).
#   05:00        09:00 GST daily Highlight Story
#   16:00 Sun-Thu / 15:00 Fri / 08:00 Sat   feed post, then its push Story +30 min
# Each slot has follow-up runs because GitHub's cron can start late. publish.py
# records every post in state/published.json, so a re-run never duplicates.
on:
  schedule:
    - cron: "0,20,40 5 * * *"
    - cron: "0,15,35,50 16 * * 0-4"
    - cron: "20 17 * * 0-4"
    - cron: "0,15,35,50 15 * * 5"
    - cron: "20 16 * * 5"
    - cron: "0,15,35,50 8 * * 6"
    - cron: "20 9 * * 6"
    - cron: "10 3 * * *"          # daily: hand newly in-range posts to Facebook's scheduler
  workflow_dispatch:
    inputs:
      mode:
        description: "publish | schedule-facebook | list-facebook | cancel-facebook | dry-run | post | story"
        default: publish
      id:
        description: "post or story id for mode=post/story (e.g. nx-d05, nx-s02-push)"
        default: ""

permissions:
  contents: write

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      PAUSED: ${{ vars.PAUSED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        run: |
          mode="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 3 * * *" ]; then mode=schedule-facebook; else mode=publish; fi
          fi
          case "$mode" in
            publish)           python3 scripts/publish.py ;;
            schedule-facebook) python3 scripts/schedule_facebook.py --apply ;;
            list-facebook)     python3 scripts/schedule_facebook.py --list ;;
            cancel-facebook)   python3 scripts/schedule_facebook.py --cancel-all ;;
            dry-run)           DRY_RUN=1 python3 scripts/publish.py && python3 scripts/schedule_facebook.py ;;
            post)              python3 scripts/publish.py --post "${{ inputs.id }}" ;;
            story)             python3 scripts/publish.py --story "${{ inputs.id }}" ;;
            *) echo "unknown mode $mode"; exit 1 ;;
          esac
      - name: Save state
        if: always()
        run: |
          git config user.name "nexvate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: published $(date -u +%FT%TZ)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
